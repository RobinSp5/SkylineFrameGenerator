[project]
name = "skylineframe"
version = "0.1.0"
description = "Generate 3D-printable city skyline frames from OpenStreetMap data"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "shapely>=2.1",
    "pyproj>=3.7",
    "osm2geojson>=0.3",
    "trimesh>=5.0",
    "manifold3d>=3.0",
    "numpy>=2",
    "scipy>=1.13",
    "networkx>=3",
    "lxml>=5",
    "typer>=0.12",
]

[project.scripts]
skylineframe = "skylineframe.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skylineframe", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Two warnings raised inside starlette/anyio when `fastapi.testclient` is imported;
# nothing we call triggers them. Matched by exact message, never by bare category.
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
